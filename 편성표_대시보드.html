<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈쇼핑 경쟁사 편성표 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .date-info {
            color: #666;
            font-size: 14px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        select {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            background: white;
            color: #333;
        }

        button {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 10px;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .time-slot {
            padding: 15px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .time-slot:hover {
            background: #efefef;
            transform: translateX(5px);
        }

        .time-slot.A등급 {
            border-left-color: #4CAF50;
        }

        .time-slot.B등급 {
            border-left-color: #FFC107;
        }

        .time-slot.C등급 {
            border-left-color: #f44336;
        }

        .time-header {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .time-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            color: #666;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
        }

        .detail-label {
            font-weight: 500;
        }

        .grade-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .grade-A {
            background: #4CAF50;
            color: white;
        }

        .grade-B {
            background: #FFC107;
            color: white;
        }

        .grade-C {
            background: #f44336;
            color: white;
        }

        .table-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .table-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #333;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .price-high {
            color: #f44336;
            font-weight: 600;
        }

        .price-mid {
            color: #FFC107;
            font-weight: 600;
        }

        .price-low {
            color: #4CAF50;
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏬 홈쇼핑 경쟁사 편성표</h1>
            <p class="date-info" id="dateInfo"></p>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label>경쟁사:</label>
                <select id="companyFilter">
                    <option value="">전체</option>
                </select>
            </div>
            <div class="filter-group">
                <label>시간대:</label>
                <select id="timeFilter">
                    <option value="">전체</option>
                </select>
            </div>
            <div class="filter-group">
                <label>등급:</label>
                <select id="gradeFilter">
                    <option value="">전체</option>
                    <option value="A등급">A등급</option>
                    <option value="B등급">B등급</option>
                    <option value="C등급">C등급</option>
                </select>
            </div>
            <button onclick="resetFilters()">초기화</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">편성 상품수</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="avgRating">0.0</div>
                <div class="stat-label">평균 평점</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalSales">0</div>
                <div class="stat-label">총 판매량</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="topCompany">-</div>
                <div class="stat-label">최강 경쟁사</div>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2>⏰ 시간대별 편성</h2>
                <div class="timeline" id="timeline"></div>
            </div>

            <div class="card">
                <h2>📊 경쟁사별 실적</h2>
                <div class="chart-container">
                    <canvas id="companyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2>⭐ 평점 분포</h2>
                <div class="chart-container">
                    <canvas id="ratingChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h2>💰 가격대별 분포</h2>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </div>

        <div class="table-section">
            <h2>📋 전체 편성표 상세</h2>
            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th>시간대</th>
                        <th>경쟁사</th>
                        <th>상품명</th>
                        <th>카테고리</th>
                        <th>가격</th>
                        <th>평점</th>
                        <th>리뷰</th>
                        <th>판매량</th>
                        <th>등급</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let scheduleData = [];
        let filteredData = [];
        let companyChart, ratingChart, priceChart;

        async function loadData() {
            const csvContent = `경쟁사,시간대,상품명,카테고리,가격대,판매량,평점,리뷰수,등급,우위항목
쿠팡,09:00-11:00,프리미엄 수납장,수납,65000,5234,4.8,2145,A,품질우수
11번가,11:00-13:00,방수 러그,바닥용품,95000,2156,4.4,1023,B,반품정책
쿠팡,13:00-15:00,LED 스탠드,조명,32000,6789,4.7,3456,A,밝기우수
GS샵,15:00-17:00,극세사 침구세트,침구,42000,4123,4.6,1856,A,가격경쟁력
쿠팡,17:00-19:00,원목 식탁,가구,320000,234,4.6,456,B,아프터서비스
옥션,19:00-21:00,린넨 쿠션세트,인테리어,35000,890,4.3,567,C,색상다양
롯데홈쇼핑,21:00-23:59,스탠드 선반,수납,55000,1234,4.5,890,B,배송빠름`;

            const lines = csvContent.trim().split('\n');
            scheduleData = lines.slice(1).map(line => {
                const [경쟁사, 시간대, 상품명, 카테고리, 가격대, 판매량, 평점, 리뷰수, 등급, 우위항목] = line.split(',');
                return {
                    경쟁사, 시간대, 상품명, 카테고리,
                    가격대: parseInt(가격대),
                    판매량: parseInt(판매량),
                    평점: parseFloat(평점),
                    리뷰수: parseInt(리뷰수),
                    등급,
                    우위항목
                };
            });

            filteredData = [...scheduleData];
            initializeFilters();
            updateDashboard();
            setDateInfo();
        }

        function initializeFilters() {
            const companies = [...new Set(scheduleData.map(d => d.경쟁사))];
            const times = [...new Set(scheduleData.map(d => d.시간대))];

            const companySelect = document.getElementById('companyFilter');
            const timeSelect = document.getElementById('timeFilter');

            companies.forEach(company => {
                const option = document.createElement('option');
                option.value = company;
                option.textContent = company;
                companySelect.appendChild(option);
            });

            times.forEach(time => {
                const option = document.createElement('option');
                option.value = time;
                option.textContent = time;
                timeSelect.appendChild(option);
            });

            companySelect.addEventListener('change', applyFilters);
            timeSelect.addEventListener('change', applyFilters);
            document.getElementById('gradeFilter').addEventListener('change', applyFilters);
        }

        function applyFilters() {
            const company = document.getElementById('companyFilter').value;
            const time = document.getElementById('timeFilter').value;
            const grade = document.getElementById('gradeFilter').value;

            filteredData = scheduleData.filter(item => {
                return (!company || item.경쟁사 === company) &&
                       (!time || item.시간대 === time) &&
                       (!grade || item.등급 === grade);
            });

            updateDashboard();
        }

        function resetFilters() {
            document.getElementById('companyFilter').value = '';
            document.getElementById('timeFilter').value = '';
            document.getElementById('gradeFilter').value = '';
            filteredData = [...scheduleData];
            updateDashboard();
        }

        function setDateInfo() {
            const today = new Date();
            const dateStr = today.toLocaleDateString('ko-KR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('dateInfo').textContent = `📅 ${dateStr} 편성표`;
        }

        function updateDashboard() {
            updateStats();
            updateTimeline();
            updateCharts();
            updateTable();
        }

        function updateStats() {
            const totalProducts = filteredData.length;
            const avgRating = (filteredData.reduce((sum, d) => sum + d.평점, 0) / totalProducts).toFixed(1);
            const totalSales = filteredData.reduce((sum, d) => sum + d.판매량, 0);

            const companyStats = {};
            filteredData.forEach(d => {
                companyStats[d.경쟁사] = (companyStats[d.경쟁사] || 0) + d.판매량;
            });
            const topCompany = Object.keys(companyStats).reduce((a, b) =>
                companyStats[a] > companyStats[b] ? a : b, '');

            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('avgRating').textContent = avgRating;
            document.getElementById('totalSales').textContent = totalSales.toLocaleString();
            document.getElementById('topCompany').textContent = topCompany;
        }

        function updateTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            filteredData.forEach(item => {
                const slot = document.createElement('div');
                slot.className = `time-slot ${item.등급}`;
                slot.innerHTML = `
                    <div class="time-header">
                        ${item.시간대} | ${item.경쟁사}
                        <span class="grade-badge grade-${item.등급.charAt(0)}">${item.등급}</span>
                    </div>
                    <div style="font-weight: 500; color: #333; margin-bottom: 8px;">${item.상품명}</div>
                    <div class="time-details">
                        <div class="detail-item">
                            <span class="detail-label">가격:</span>
                            <span>₩${item.가격대.toLocaleString()}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">평점:</span>
                            <span>⭐ ${item.평점}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">판매량:</span>
                            <span>${item.판매량.toLocaleString()}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">리뷰:</span>
                            <span>${item.리뷰수.toLocaleString()}</span>
                        </div>
                    </div>
                `;
                timeline.appendChild(slot);
            });
        }

        function updateCharts() {
            // 경쟁사별 판매량
            const companyData = {};
            filteredData.forEach(d => {
                companyData[d.경쟁사] = (companyData[d.경쟁사] || 0) + d.판매량;
            });

            const ctx1 = document.getElementById('companyChart').getContext('2d');
            if (companyChart) companyChart.destroy();
            companyChart = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: Object.keys(companyData),
                    datasets: [{
                        label: '판매량',
                        data: Object.values(companyData),
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#43e97b']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // 평점 분포
            const ratingData = {};
            filteredData.forEach(d => {
                const rating = Math.round(d.평점 * 10) / 10;
                ratingData[rating] = (ratingData[rating] || 0) + 1;
            });

            const ctx2 = document.getElementById('ratingChart').getContext('2d');
            if (ratingChart) ratingChart.destroy();
            ratingChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(ratingData),
                    datasets: [{
                        data: Object.values(ratingData),
                        backgroundColor: ['#4CAF50', '#8BC34A', '#FFC107', '#FF9800', '#f44336']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // 가격대 분포
            const priceRanges = {
                '저가(~40k)': filteredData.filter(d => d.가격대 <= 40000).length,
                '중가(40k~100k)': filteredData.filter(d => d.가격대 > 40000 && d.가격대 <= 100000).length,
                '고가(100k~)': filteredData.filter(d => d.가격대 > 100000).length
            };

            const ctx3 = document.getElementById('priceChart').getContext('2d');
            if (priceChart) priceChart.destroy();
            priceChart = new Chart(ctx3, {
                type: 'pie',
                data: {
                    labels: Object.keys(priceRanges),
                    datasets: [{
                        data: Object.values(priceRanges),
                        backgroundColor: ['#4CAF50', '#FFC107', '#f44336']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function updateTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            filteredData.forEach(item => {
                const row = document.createElement('tr');
                const priceClass = item.가격대 <= 40000 ? 'price-low' :
                                   item.가격대 <= 100000 ? 'price-mid' : 'price-high';

                row.innerHTML = `
                    <td>${item.시간대}</td>
                    <td><strong>${item.경쟁사}</strong></td>
                    <td>${item.상품명}</td>
                    <td>${item.카테고리}</td>
                    <td class="${priceClass}">₩${item.가격대.toLocaleString()}</td>
                    <td>⭐ ${item.평점}</td>
                    <td>${item.리뷰수.toLocaleString()}</td>
                    <td>${item.판매량.toLocaleString()}</td>
                    <td><span class="grade-badge grade-${item.등급.charAt(0)}">${item.등급}</span></td>
                `;
                tbody.appendChild(row);
            });
        }

        loadData();
    </script>
</body>
</html>
